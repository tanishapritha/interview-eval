name: evaluation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Run golden evaluation
        run: interview-eval run --dataset datasets/golden/demo.jsonl --output reports/ci-report.json
